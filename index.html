<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OMC World · 服务器状态</title>
<meta name="description" content="OMC World 服务器实时状态：在线人数、TPS 与连接地址。">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
<header class="topbar">
  <div class="wrap topbar-in">
    <a class="brand" href="./index.html">OMC <span>WORLD</span></a>
    <nav class="nav">
      <a href="./index.html">状态</a>
      <a href="./stocks.html">股票</a>
      <a href="./market.html">物品行情</a>
      <a href="./play.html">进服</a>
      <a href="./rules.html">规则</a>
    </nav>
    <a class="btn btn-sm account" data-account-link href="./play.html">账号绑定 <span data-account-note></span></a>
  </div>
</header>
<main class="wrap">
  <div class="page-head">
    <h1>服务器状态</h1>
    <p class="sub">实时读取服务端数据，每 5 秒刷新；断线时保留最后一次成功数据。</p>
  </div>

  <section class="statusbar" aria-live="polite">
    <div class="stat-inline"><span class="k">在线</span><span class="v" id="stat-online">—</span><span class="k" id="stat-max"></span></div>
    <div class="stat-inline"><span class="k">TPS</span><span class="v" id="stat-tps">—</span></div>
    <div class="stat-inline"><span class="k">版本</span><span class="v" id="stat-version">—</span></div>
    <div class="src"><span class="dot off" id="src-dot"></span><span id="src-text">连接中</span><span class="sep">·</span><span id="src-time"></span></div>
  </section>

  <div class="notice hidden" id="offline-note">
    <span class="dot off"></span>
    <div><b>服务端未连接</b> · <span id="offline-detail">等待服务端恢复，页面每 5 秒重试。</span></div>
  </div>

  <div class="grid-main">
    <section class="panel">
      <div class="panel-head"><h2>在线人数</h2><span class="meta" id="chart-meta">采样中</span></div>
      <div class="panel-body"><div class="chart" id="online-chart"><div class="chart-empty">数据采集中</div></div></div>
    </section>

    <section class="panel">
      <div class="panel-head"><h2>服务器</h2><span class="meta" id="srv-meta">—</span></div>
      <div class="panel-body">
        <div class="kv kv-1">
          <div><span>状态</span><b id="srv-state">—</b></div>
          <div><span>版本</span><b id="srv-version">—</b></div>
          <div><span>世界</span><b id="srv-world">—</b></div>
          <div><span>运行</span><b id="srv-uptime">—</b></div>
        </div>
        <p class="small muted" id="srv-players" style="margin-top:10px">—</p>
      </div>
    </section>
  </div>

  <div class="cards">
    <a class="card" href="./stocks.html"><div class="t">股票行情</div><div class="d">价格 · 涨跌 · 下单</div></a>
    <a class="card" href="./market.html"><div class="t">物品行情</div><div class="d">成交价 · 涨跌</div></a>
    <a class="card" href="./play.html"><div class="t">进服指引</div><div class="d">地址 · 版本</div></a>
    <a class="card" href="./rules.html"><div class="t">玩家规则</div><div class="d">八条</div></a>
    <a class="card" href="./play.html" data-account-link><div class="t">账号绑定</div><div class="d" data-account-note>暂未开放</div></a>
  </div>

  <section class="panel" style="margin-top:18px">
    <div class="panel-body" style="display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px">
      <span class="muted small">连接地址</span>
      <span class="addr" id="addr">待开通</span>
      <button class="btn btn-sm" type="button" id="copy-addr" data-copy="" disabled>未开通</button>
      <span class="sep">|</span>
      <span class="muted small">版本</span><b class="mono" id="addr-version">1.21.11</b>
    </div>
  </section>
</main>

<footer class="foot"><div class="wrap"><span>OMC World</span><span class="sep">·</span><span>数据来自服务端公开接口</span><span class="sep">·</span><span>© <span data-year>2026</span></span></div></footer>
<div id="toast-host"></div>

<script src="./config.js" defer></script>
<script src="./assets/js/util.js" defer></script>
<script src="./assets/js/api.js" defer></script>
<script src="./assets/js/live.js" defer></script>
<script src="./assets/js/chart.js" defer></script>
<script src="./assets/js/nav.js" defer></script>
<script src="./assets/js/home.js" defer></script>
</body>
</html>
