<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OMC World · 物品行情</title>
<meta name="description" content="OMC World 物品实时行情。">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./assets/css/style.css?v=20261110c">
</head>
<body>
<header class="topbar">
  <div class="wrap topbar-in">
    <a class="brand" href="./index.html">OMC <span>WORLD</span></a>
    <nav class="nav">
      <a href="./index.html">状态</a>
      <a href="./stocks.html">股票</a>
      <a href="./market.html">物品行情</a>
      <a href="./play.html">进服</a>
      <a href="./rules.html">规则</a>
    </nav>
    <a class="btn btn-sm account" data-account-link href="./play.html">账号绑定 <span data-account-note></span></a>
  </div>
</header>
<main class="wrap">
  <div class="page-head">
    <h1>物品行情</h1>
    <p class="sub">服务端实时成交价，每 5 秒刷新。</p>
  </div>

  <section class="statusbar" aria-live="polite">
    <div class="stat-inline"><span class="k">物品</span><span class="v" id="mkt-count">—</span><span class="k">种</span></div>
    <div class="src"><span class="dot off" id="src-dot"></span><span id="src-text">连接中</span><span class="sep">·</span><span id="src-time"></span></div>
  </section>

  <div class="notice hidden" id="offline-note">
    <span class="dot off"></span>
    <div><b>服务端未连接</b> · <span id="offline-detail">等待服务端恢复，页面每 5 秒重试。</span></div>
  </div>

  <div class="grid-main">
    <section class="panel">
      <div class="panel-head"><h2>物品</h2><span class="meta">点击查看</span></div>
      <div class="tbl-wrap">
        <table class="tbl">
          <thead><tr>
            <th>物品</th><th class="num">现价</th><th class="num">涨跌</th><th class="num">成交量</th><th>走势</th>
          </tr></thead>
          <tbody id="market-body"><tr><td colspan="5" class="muted">暂无数据</td></tr></tbody>
        </table>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head"><h2>详情</h2><span class="meta" id="i-updated">—</span></div>
      <div class="panel-body">
        <div class="detail-head">
          <span class="sym" id="i-name">—</span>
          <span class="px" id="i-price">—</span>
          <span class="chg" id="i-chg">—</span>
        </div>
        <div class="chart" id="i-chart"><div class="chart-empty">暂无数据</div></div>
        <div class="kv">
          <div><span>成交量</span><b id="i-vol">—</b></div>
          <div><span>买盘</span><b id="i-buyers">—</b></div>
          <div><span>卖盘</span><b id="i-sellers">—</b></div>
          <div><span>编号</span><b id="i-id">—</b></div>
        </div>
      </div>
    </section>
  </div>
</main>

<footer class="foot"><div class="wrap"><span>OMC World</span><span class="sep">·</span><span>© <span data-year>2026</span></span></div></footer>
<div id="toast-host"></div>
<script src="./config.js?v=20261110c" defer></script>
<script src="./assets/js/util.js?v=20261110c" defer></script>
<script src="./assets/js/api.js?v=20261110c" defer></script>
<script src="./assets/js/live.js?v=20261110c" defer></script>
<script src="./assets/js/chart.js?v=20261110c" defer></script>
<script src="./assets/js/nav.js?v=20261110c" defer></script>
<script src="./assets/js/market.js?v=20261110c" defer></script>
</body>
</html>
