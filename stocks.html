<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OMC World · 股票行情</title>
<meta name="description" content="OMC World 股票实时行情与下单。">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./assets/css/style.css?v=20261110c">
</head>
<body>
<header class="topbar">
  <div class="wrap topbar-in">
    <a class="brand" href="./index.html">OMC <span>WORLD</span></a>
    <nav class="nav">
      <a href="./index.html">状态</a>
      <a href="./stocks.html">股票</a>
      <a href="./market.html">物品行情</a>
      <a href="./play.html">进服</a>
      <a href="./rules.html">规则</a>
    </nav>
    <a class="btn btn-sm account" data-account-link href="./play.html">账号绑定 <span data-account-note></span></a>
  </div>
</header>
<main class="wrap">
  <div class="page-head">
    <h1>股票行情</h1>
    <p class="sub">实时价格与涨跌，每 5 秒刷新；下单需游戏内绑定码。</p>
  </div>

  <section class="statusbar" aria-live="polite">
    <div class="stat-inline"><span class="k">数据</span><span class="v" id="mkt-count">—</span><span class="k">只</span></div>
    <div class="stat-inline"><span class="k">刷新</span><span class="v">5s</span></div>
    <div class="src"><span class="dot off" id="src-dot"></span><span id="src-text">连接中</span><span class="sep">·</span><span id="src-time"></span></div>
  </section>

  <div class="notice hidden" id="offline-note">
    <span class="dot off"></span>
    <div><b>服务端未连接</b> · <span id="offline-detail">等待服务端恢复，页面每 5 秒重试。</span></div>
  </div>

  <div class="grid-main">
    <section class="panel">
      <div class="panel-head"><h2>全部股票</h2><span class="meta">点击查看</span></div>
      <div class="tbl-wrap">
        <table class="tbl">
          <thead><tr>
            <th>代码</th><th>名称</th><th class="num">现价</th><th class="num">涨跌</th><th class="num">成交量</th><th>走势</th>
          </tr></thead>
          <tbody id="stock-body"><tr><td colspan="6" class="muted">暂无数据</td></tr></tbody>
        </table>
      </div>
    </section>

    <div>
      <section class="panel">
        <div class="panel-head"><h2>详情</h2><span class="meta" id="d-updated">—</span></div>
        <div class="panel-body">
          <div class="detail-head">
            <span class="sym" id="d-sym">—</span>
            <span class="px" id="d-price">—</span>
            <span class="chg" id="d-chg">—</span>
          </div>
          <p class="small muted" id="d-name">—</p>
          <div class="chart" id="d-chart"><div class="chart-empty">暂无数据</div></div>
          <div class="kv">
            <div><span>成交量</span><b id="d-vol">—</b></div>
            <div><span>市值</span><b id="d-cap">—</b></div>
            <div><span>持有人</span><b id="d-holders">—</b></div>
            <div><span>板块</span><b id="d-sector">—</b></div>
          </div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head"><h2>下单</h2><span class="meta" id="o-meta">—</span></div>
        <div class="panel-body">
          <div class="seg" role="group" aria-label="买卖方向">
            <button type="button" class="buy" data-side="buy" aria-pressed="true">买入</button>
            <button type="button" class="sell" data-side="sell" aria-pressed="false">卖出</button>
          </div>
          <div class="field">
            <label class="f" for="o-qty">数量</label>
            <input class="input" id="o-qty" type="number" min="1" step="1" value="1" inputmode="numeric">
          </div>
          <div class="field">
            <label class="f" for="o-link">绑定码</label>
            <input class="input" id="o-link" type="text" maxlength="16" autocomplete="off" placeholder="游戏内 /link 获取">
          </div>
          <div class="est"><span>参考价</span><b id="o-price">—</b></div>
          <div class="est"><span>预计金额</span><b id="o-total">—</b></div>
          <div class="est"><span>余额</span><b id="o-balance">—</b></div>
          <button class="btn btn-primary btn-block" type="button" id="o-submit" disabled>买入</button>
          <p class="msg" id="o-msg"></p>
          <p class="small muted">也可在游戏内使用 <code class="mono">/stock buy &lt;代码&gt; &lt;数量&gt;</code></p>
        </div>
      </section>
    </div>
  </div>
</main>

<footer class="foot"><div class="wrap"><span>OMC World</span><span class="sep">·</span><span>行情与成交以服务端返回为准</span><span class="sep">·</span><span>© <span data-year>2026</span></span></div></footer>
<div id="toast-host"></div>

<script src="./config.js?v=20261110c" defer></script>
<script src="./assets/js/util.js?v=20261110c" defer></script>
<script src="./assets/js/api.js?v=20261110c" defer></script>
<script src="./assets/js/live.js?v=20261110c" defer></script>
<script src="./assets/js/chart.js?v=20261110c" defer></script>
<script src="./assets/js/nav.js?v=20261110c" defer></script>
<script src="./assets/js/stocks.js?v=20261110c" defer></script>
</body>
</html>
